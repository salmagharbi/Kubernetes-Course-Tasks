piVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web-deployment
  name: web-deployment
  namespace: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      shareProcessNamespace: true
      initContainers:
      - name: init-done
        image: busybox:1.36
        command: ["sh", "-c", "echo done"]
      containers:
      - image: nginx:1.27
        name: nginx
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</h1>">
          nginx -g 'daemon off;'
      - name: time-updater
        image: busybox:1.36
        securityContext:
          capabilities:
            add: ["SYS_PTRACE"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            PID=$(pgrep -o nginx)
            if [ -n "$PID" ]; then
              echo "<h1>hello in MLOPS MENA COMMUNITY : $(date '+%Y-%m-%d %H:%M:%S')</>
                > /proc/$PID/root/usr/share/nginx/html/index.html
            fi
            sleep 5
          done

